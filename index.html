<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شات صوتي ذكي (Firebase + المتصفح)</title>
  
  <!-- Tailwind CSS للتصميم -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    .chat-bubble { max-width: 75%; word-wrap: break-word; }
    .my-message { background-color: #dcf8c6; border-radius: 15px 15px 0 15px; }
    .other-message { background-color: #ffffff; border-radius: 15px 15px 15px 0; }
    #chatBox::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-gray-200 h-screen flex flex-col font-sans">

  <header class="bg-green-600 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold">شات الذكاء الاصطناعي</h1>
    <div class="text-sm bg-green-700 px-3 py-1 rounded-full">أنت: <span id="currentUserDisplay">User 1</span></div>
  </header>

  <main id="chatBox" class="flex-1 overflow-y-auto p-4 flex flex-col space-y-4">
    <!-- الرسائل ستظهر هنا -->
  </main>

  <footer class="bg-gray-100 p-3 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] flex items-center gap-2">
    <select id="userSelector" class="p-2 rounded-lg border border-gray-300 focus:outline-none focus:border-green-500 bg-white text-sm">
      <option value="user_1">User 1</option>
      <option value="user_2">User 2</option>
    </select>
    
    <input type="text" id="chatInput" placeholder="اكتب رسالتك هنا..." 
           class="flex-1 p-3 rounded-full border border-gray-300 focus:outline-none focus:border-green-500">
    
    <button id="sendButton" class="bg-green-600 text-white p-3 rounded-full hover:bg-green-700 transition duration-200 flex items-center justify-center w-12 h-12 shadow-md">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 transform -rotate-45" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
      </svg>
    </button>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB-1zdQU3aRHBxp0bc7JxvQlzxO0VUPyyA",
      authDomain: "astoghmayty.firebaseapp.com",
      projectId: "astoghmayty",
      storageBucket: "astoghmayty.firebasestorage.app",
      messagingSenderId: "561561877601",
      appId: "1:561561877601:web:ad47083566186f3e2efe20",
      measurementId: "G-LNT11SME4D"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = ref(db, "messages");

    const chatBox = document.getElementById("chatBox");
    const chatInput = document.getElementById("chatInput");
    const sendButton = document.getElementById("sendButton");
    const userSelector = document.getElementById("userSelector");
    const currentUserDisplay = document.getElementById("currentUserDisplay");

    // وقت فتح الصفحة (لكي لا ينطق المتصفح الرسائل القديمة عند تحديث الصفحة)
    const pageLoadTime = Date.now();

    // دالة تحويل النص إلى صوت مصري باستخدام متصفح جوجل
    window.speakEgyptianText = function(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // إيقاف أي صوت شغال حالياً
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ar-EG'; // اللهجة المصرية
        utterance.rate = 0.95;    // سرعة القراءة
        window.speechSynthesis.speak(utterance);
      } else {
        console.log("متصفحك لا يدعم تحويل النص لصوت");
      }
    };

    // دالة عرض الرسالة
    function renderMessage(message, messageId) {
      if(document.getElementById(messageId)) return;

      const currentUserId = userSelector.value;
      const isMyMessage = message.senderId === currentUserId;
      
      const messageDiv = document.createElement("div");
      messageDiv.id = messageId;
      messageDiv.className = `flex ${isMyMessage ? 'justify-end' : 'justify-start'}`;
      
      const bubbleClass = isMyMessage ? 'my-message text-gray-800' : 'other-message text-gray-800 border border-gray-200 shadow-sm';

      messageDiv.innerHTML = `
        <div class="chat-bubble p-3 ${bubbleClass} relative">
          <p class="text-[15px] leading-relaxed mb-1">${message.text}</p>
          <div class="flex justify-between items-center text-[10px] text-gray-500 mt-1">
             <span>${new Date(message.timestamp).toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'})}</span>
             ${!isMyMessage ? `<button onclick="window.speakEgyptianText('${message.text}')" class="text-blue-500 hover:text-blue-700">🔊 إعادة السماع</button>` : '✓'}
          </div>
        </div>
      `;
      
      chatBox.appendChild(messageDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // إرسال الرسالة إلى Firebase
    function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      const senderId = userSelector.value;
      const receiverId = senderId === "user_1" ? "user_2" : "user_1";

      push(messagesRef, {
        text: text,
        senderId: senderId,
        receiverId: receiverId,
        timestamp: Date.now()
      });

      chatInput.value = ""; 
    }

    sendButton.addEventListener("click", sendMessage);
    chatInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    userSelector.addEventListener("change", (e) => {
      currentUserDisplay.innerText = e.target.value === "user_1" ? "User 1" : "User 2";
    });

    // الاستماع للرسائل القادمة من Firebase في نفس اللحظة
    onChildAdded(messagesRef, (snapshot) => {
      const message = snapshot.val();
      const messageId = snapshot.key;
      const currentUserId = userSelector.value;

      // 1. عرض الرسالة في الشات
      renderMessage(message, messageId);

      // 2. تشغيل الصوت تلقائياً (فقط إذا كانت الرسالة جديدة ومبعوثة لي أنا)
      if (message.timestamp > pageLoadTime && message.receiverId === currentUserId) {
        window.speakEgyptianText(message.text);
      }
    });
  </script>
</body>
  </html>
